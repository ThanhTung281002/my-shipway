<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <title>Tìm kiếm tài xế</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- DaisyUI -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
</head>

<body class=" min-h-screen flex flex-col">

    <div class="navbar shadow-md flex-none z-10">navbar</div>

    <div id="loading" class=" flex-1 flex justify-center py-10 hidden">
      <span class="loading loading-dots loading-lg"></span>
    </div>

    <div id="content-container" class="container flex-1 bg-base-200 flex">
        <div id="booking-details" class="card w-1/4 bg-base-100 m-4 ml-6"></div>


        <div id="drivers-list" class="w-1/2 bg-base-100 p-4">
          <h1 class="title text-4xl flex justify-center">Danh sách tài xế</h1>
          <div class="list mt-12">
            <table class="table text-base">
              <!-- head -->
              <thead class="text-base font-bold">
                <tr>
                  
                  <th >Tài xế</th>
                  <th >Loại xe</th>
                  <th >Đánh giá</th>
                  <th class="whitespace-normal text-center max-w-40">Khoảng cách tới điểm nhận hàng</th> 
                  <th>Giá cước</th>
                </tr>
              </thead>


              <tbody id="table-body"></tbody>
            </table>

          </div>

          <div id="rescan-helper" class="helper flex flex-col justify-center mt-20 hidden">
            <p class="helper-text flex justify-center">Không hài lòng với danh sách tài xế</p>
            <div class="button-section flex justify-center mt-4">
              <button id="rescan-button" class="btn btn-ghost btn-outline text-lg">Tìm kiếm lại</button>
            </div>
            
          </div>

        </div> 



        <div id="driver-detail" class="card w-1/4 bg-base-100 mr-8 m-6"></div>

    </div>


    <dialog id="confirm-driver-modal" class="modal">
        <div class="modal-box max-w-2xl">
            <h3 class="font-bold text-2xl mb-4">Thông tin xác nhận</h3>


            <div class="info flex flex-cols gap-2">
                <div class="labell">Tài xế:</div>
                <div id="modal-content-name" class="content"></div>
            </div>
            <div class="info flex flex-cols gap-2">
                <div class="labell">Đánh giá:</div>
                <div id="modal-content-rating" class="content"></div>
            </div>
            <div class="info flex flex-cols gap-2">
                <div class="labell">Giá cước:</div>
                <div id="modal-content-price-offer" class="content"></div>
            </div>
            <div class="info flex flex-cols gap-2">
                <div class="labell">Loại xe:</div>
                <div id="modal-content-vehicle" class="content"></div>
            </div>



            <div class="modal-action">
                <button id="cancel-button" class="btn btn-outline btn-secondary">Hủy</button>
                <button id="confirm-button" class="btn btn-primary">Xác nhận</button>
            </div>
        </div>
    </dialog>


    <script src="/scan-page.js"></script>
</body>
</html>
